name: Release 🏗️

# This package is consumed as a git dependency (github:omnidotdev/providers#<tag>
# or #<commit>, which is why build/ is committed), not published to npm. It is
# marked private, so `bun release` runs `changeset publish`, which (with
# privatePackages.tag enabled in .changeset/config.json) only creates the git tag
# for the release; the action then pushes it and opens the GitHub release. On a
# push that still has pending changesets, the action instead opens or updates
# the "version packages" PR.
on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    name: Handle release 🦋
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          # pin Bun so the toolchain does not drift with floating latest
          bun-version: 1.4.4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Create release PR or tag release
        uses: changesets/action@v2
        with:
          publish-script: bun release
          pr-title: "feature(release): version packages"
          commit-message: "ci(changesets): version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
